name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANSIBLE_FORCE_COLOR: "1"
  PY_COLORS: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: yamllint
        run: yamllint -s .
      - name: ansible-lint (production profile)
        run: ansible-lint
      - name: Syntax check (example and CI inventories)
        run: |
          for inv in example ci; do
            ansible-playbook -i "inventories/$inv" playbooks/site.yml --syntax-check
            ansible-playbook -i "inventories/$inv" playbooks/verify.yml --syntax-check
          done

  gateway:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ".[test]"
      - name: Unit and HTTP tests
        run: python -m pytest -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gateway
          load: true
          tags: llm-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (fail on HIGH/CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-gateway:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The whole platform on a real VM: every role, a real model, then a second run that must change
  # nothing, the end-to-end checks, and a benchmark.
  e2e:
    needs: [lint, gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt httpx==0.28.1
      - name: Runner facts
        run: |
          echo "CPU: $(lscpu | sed -n 's/^Model name: *//p') x $(nproc) vCPU, RAM: $(free -g | awk '/Mem:/{print $2}') GiB"
          dpkg -l | awk '/docker-ce |moby-engine /{print $2, $3}'
      - name: Generate throw-away secrets
        run: scripts/ci-secrets.sh
      - name: Converge (first run)
        run: ansible-playbook -i inventories/ci playbooks/site.yml
      - name: Idempotence (second run must change nothing)
        run: |
          ansible-playbook -i inventories/ci playbooks/site.yml | tee second-run.log
          if grep -E 'changed=[1-9]' second-run.log; then
            echo "::error::The second run changed something; the roles are not idempotent"; exit 1
          fi
      - name: End-to-end verification
        run: ansible-playbook -i inventories/ci playbooks/verify.yml
      - name: Benchmark (real model on the runner's CPU)
        run: |
          key=$(python3 -c "import yaml;print(yaml.safe_load(open('inventories/ci/group_vars/all/secrets.yml'))['vault_gateway_teams'][0]['key'])")
          cpu="$(lscpu | sed -n 's/^Model name: *//p') x $(nproc) vCPU"
          python3 scripts/benchmark.py --url http://127.0.0.1:8000 --key "$key" --model qwen2.5-0.5b-instruct \
            --concurrency 1,4 --requests 8 --max-tokens 128 --json benchmark-ci.json \
            --note "GitHub-hosted runner, CPU only ($cpu). Two llama.cpp servers (2 threads, 2 slots each) behind the gateway; Qwen2.5-0.5B-Instruct Q4_K_M." \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark
          path: benchmark-ci.json
          if-no-files-found: ignore
      - name: Diagnostics
        if: failure()
        run: |
          sudo docker ps -a
          for c in $(sudo docker ps -aq --filter label=llm-platform.component); do
            echo "::group::$(sudo docker inspect -f '{{.Name}}' $c)"; sudo docker logs --tail 80 $c 2>&1; echo "::endgroup::"
          done
          sudo nft list table inet llm_platform || true
          sudo systemctl status llm-platform-firewall --no-pager || true

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (checksum-verified)
        run: |
          v=8.30.1; base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSLO "$base/gitleaks_${v}_linux_x64.tar.gz"; curl -sSLO "$base/gitleaks_${v}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${v}_checksums.txt"
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --exit-code 1 .
