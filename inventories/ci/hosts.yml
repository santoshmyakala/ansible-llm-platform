---
# GitHub Actions runner: every role on one machine, Ansible connecting locally.
all:
  hosts:
    ci-node:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
      platform_address: 127.0.0.1
  children:
    inference: {hosts: {ci-node: }}
    gateway: {hosts: {ci-node: }}
    monitoring: {hosts: {ci-node: }}
    chat_ui: {hosts: {ci-node: }}
