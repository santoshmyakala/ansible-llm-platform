---
# Example: four servers in one site. Every host needs `platform_address`, the IP the other
# nodes use to reach it (firewall rules are generated from these addresses).
all:
  hosts:
    gpu-01:
      ansible_host: 10.20.0.11
      platform_address: 10.20.0.11
    gpu-02:
      ansible_host: 10.20.0.12
      platform_address: 10.20.0.12
    cpu-01:
      ansible_host: 10.20.0.21
      platform_address: 10.20.0.21
    ops-01:
      ansible_host: 10.20.0.31
      platform_address: 10.20.0.31
  children:
    inference:
      hosts:
        gpu-01:
        gpu-02:
        cpu-01:
    gateway:
      hosts:
        ops-01:
    monitoring:
      hosts:
        ops-01:
    chat_ui:
      hosts:
        ops-01:
